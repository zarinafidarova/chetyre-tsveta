# Четыре цвета: фронт из /var/www/chetyre-tsveta/web/dist,
# игра по WebSocket — Go-сервер на 127.0.0.1:8095 (служба uno, ставит deploy/update.sh).
# HTTPS добавит certbot: certbot --nginx -d uno.brayan-train.ru

# Своё имя переменной, чтобы не столкнуться с таким же map в других сайтах.
map $http_upgrade $uno_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name uno.brayan-train.ru;

    root /var/www/chetyre-tsveta/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # игра: долгоживущее WebSocket-соединение
    location = /ws {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $uno_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # сервер пингует клиентов каждые 25 секунд, час — с большим запасом
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8095;
        access_log off;
    }

    # страница всегда перепроверяется, иначе после выкатки останется старая версия
    location = /index.html { add_header Cache-Control "no-cache"; }

    # файлы сборки с хэшем в имени не меняются никогда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /cards/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # всё остальное (в том числе приглашения /?code=ABCD) — в приложение
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Четыре цвета — uno.brayan-train.ru
# Копируется в /etc/nginx/sites-available/uno.brayan-train.ru
#
# nginx отдаёт собранный фронт из /var/www/uno (содержимое web/dist),
# а WebSocket /ws проксирует на Go-сервер, который слушает 127.0.0.1:8095
# (запуск: HTTP_ADDR=127.0.0.1:8095 ./uno-server).

# Своё имя переменной, чтобы не столкнуться с таким же map в других сайтах.
map $http_upgrade $uno_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name uno.brayan-train.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uno.brayan-train.ru;

    ssl_certificate     /etc/letsencrypt/live/uno.brayan-train.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uno.brayan-train.ru/privkey.pem;

    root /var/www/uno;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Скрытые файлы наружу не отдаём.
    location ~ /\.(?!well-known) { deny all; }

    # Игра: долгоживущее WebSocket-соединение.
    location = /ws {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $uno_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сервер пингует клиентов каждые 25 секунд, час — с большим запасом.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8095;
        access_log off;
    }

    # Файлы сборки Vite с хэшем в имени не меняются — кэшируем навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html перепроверяется каждый раз, чтобы новая версия доезжала сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Всё остальное (в том числе ссылки-приглашения /?code=ABCD) — в приложение.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
